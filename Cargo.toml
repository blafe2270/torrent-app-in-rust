[package]
name = "rustorrent"
version = "0.2.0"
edition = "2024"
rust-version = "1.95"
description = "A fast, simple cross-platform BitTorrent client with a GUI"
license = "MIT"

[dependencies]
anyhow = "1.0.105"
bytes = "1.12.2"
dirs = "7.0.0"
eframe = "0.37.0"
librqbit = { version = "9.1.0", default-features = false, features = ["rust-tls"] }
rfd = "0.18.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2.5.9"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

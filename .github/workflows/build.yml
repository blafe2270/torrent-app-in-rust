name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Publish a release with this tag (e.g. v0.1.2) from the selected branch. Leave empty to just build."
        required: false
        default: ""

permissions:
  contents: write # needed to publish releases on tags

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Lint & test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  linux:
    name: Linux (x86_64)
    runs-on: ubuntu-22.04 # older glibc = runs on more distros
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked
      - name: Package
        run: |
          mkdir -p dist/rustorrent-linux-x86_64
          cp target/release/rustorrent dist/rustorrent-linux-x86_64/
          cp packaging/linux/rustorrent.desktop README.md LICENSE dist/rustorrent-linux-x86_64/
          cp assets/icon-256.png dist/rustorrent-linux-x86_64/rustorrent.png
          tar -C dist -czf rustorrent-linux-x86_64.tar.gz rustorrent-linux-x86_64
      - uses: actions/upload-artifact@v4
        with:
          name: rustorrent-linux-x86_64
          path: rustorrent-linux-x86_64.tar.gz

  windows:
    name: Windows (x86_64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/rustorrent-windows-x86_64 | Out-Null
          Copy-Item target/release/rustorrent.exe, README.md, LICENSE dist/rustorrent-windows-x86_64/
          Compress-Archive -Path dist/rustorrent-windows-x86_64 -DestinationPath rustorrent-windows-x86_64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: rustorrent-windows-x86_64
          path: rustorrent-windows-x86_64.zip

  macos:
    name: macOS (universal)
    runs-on: macos-latest
    env:
      # Optional: set these repository secrets to sign and notarize the app.
      MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked --target aarch64-apple-darwin
      - run: cargo build --release --locked --target x86_64-apple-darwin
      - name: Build universal .app bundle
        run: |
          VERSION=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          APP=dist/Rustorrent.app
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp assets/icon.icns "$APP/Contents/Resources/AppIcon.icns"
          lipo -create -output "$APP/Contents/MacOS/rustorrent" \
            target/aarch64-apple-darwin/release/rustorrent \
            target/x86_64-apple-darwin/release/rustorrent
          sed "s/__VERSION__/$VERSION/g" packaging/macos/Info.plist > "$APP/Contents/Info.plist"
          # Ad-hoc signature so Apple Silicon will run it (replaced below
          # by a Developer ID signature when credentials are configured).
          codesign --force --deep --sign - "$APP"
      - name: Sign and notarize
        if: env.MACOS_CERTIFICATE != ''
        run: |
          APP=dist/Rustorrent.app
          echo "$MACOS_CERTIFICATE" | base64 --decode > cert.p12
          security create-keychain -p ci build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p ci build.keychain
          security import cert.p12 -k build.keychain -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k ci build.keychain
          IDENTITY=$(security find-identity -v -p codesigning build.keychain | grep "Developer ID Application" | head -1 | awk -F'"' '{print $2}')
          codesign --force --deep --options runtime --timestamp --sign "$IDENTITY" "$APP"
          ditto -c -k --keepParent "$APP" notarize.zip
          xcrun notarytool submit notarize.zip --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --wait
          xcrun stapler staple "$APP"
          rm -f cert.p12 notarize.zip
      - name: Package
        run: |
          cp README.md LICENSE dist/
          ditto -c -k --keepParent dist/Rustorrent.app rustorrent-macos-universal.zip
      - uses: actions/upload-artifact@v4
        with:
          name: rustorrent-macos-universal
          path: rustorrent-macos-universal.zip

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    needs: [check, linux, windows, macos]
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.release_tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - name: Check tag matches Cargo.toml version
        run: |
          VERSION=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          if [ "$TAG" != "v$VERSION" ]; then
            echo "::error::Tag $TAG does not match Cargo.toml version v$VERSION"
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          files: artifacts/*
          generate_release_notes: true

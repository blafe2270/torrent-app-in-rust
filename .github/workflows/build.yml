name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Publish a release with this tag (e.g. v0.1.2) from the selected branch. Leave empty to just build."
        required: false
        default: ""

permissions:
  contents: write # needed to publish releases on tags

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Lint & test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  linux:
    name: Linux (x86_64)
    runs-on: ubuntu-22.04 # older glibc = runs on more distros
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked
      - name: Package
        run: |
          mkdir -p dist/rustorrent-linux-x86_64
          cp target/release/rustorrent dist/rustorrent-linux-x86_64/
          cp packaging/linux/rustorrent.desktop README.md LICENSE dist/rustorrent-linux-x86_64/
          tar -C dist -czf rustorrent-linux-x86_64.tar.gz rustorrent-linux-x86_64
      - uses: actions/upload-artifact@v4
        with:
          name: rustorrent-linux-x86_64
          path: rustorrent-linux-x86_64.tar.gz

  windows:
    name: Windows (x86_64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/rustorrent-windows-x86_64 | Out-Null
          Copy-Item target/release/rustorrent.exe, README.md, LICENSE dist/rustorrent-windows-x86_64/
          Compress-Archive -Path dist/rustorrent-windows-x86_64 -DestinationPath rustorrent-windows-x86_64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: rustorrent-windows-x86_64
          path: rustorrent-windows-x86_64.zip

  macos:
    name: macOS (universal)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked --target aarch64-apple-darwin
      - run: cargo build --release --locked --target x86_64-apple-darwin
      - name: Build universal .app bundle
        run: |
          VERSION=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          APP=dist/Rustorrent.app
          mkdir -p "$APP/Contents/MacOS"
          lipo -create -output "$APP/Contents/MacOS/rustorrent" \
            target/aarch64-apple-darwin/release/rustorrent \
            target/x86_64-apple-darwin/release/rustorrent
          sed "s/__VERSION__/$VERSION/g" packaging/macos/Info.plist > "$APP/Contents/Info.plist"
          # Ad-hoc signature so Apple Silicon will run it.
          codesign --force --deep --sign - "$APP"
          cp README.md LICENSE dist/
          ditto -c -k --keepParent dist/Rustorrent.app rustorrent-macos-universal.zip
      - uses: actions/upload-artifact@v4
        with:
          name: rustorrent-macos-universal
          path: rustorrent-macos-universal.zip

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    needs: [check, linux, windows, macos]
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.release_tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - name: Check tag matches Cargo.toml version
        run: |
          VERSION=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          if [ "$TAG" != "v$VERSION" ]; then
            echo "::error::Tag $TAG does not match Cargo.toml version v$VERSION"
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          files: artifacts/*
          generate_release_notes: true
